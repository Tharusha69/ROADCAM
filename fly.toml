# fly.toml app configuration file generated for roadcam--1v-vq on 2026-08-11T11:48:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'roadcam--1v-vq'
primary_region = 'ams'

[build]

[[mounts]]
  source = 'roadcam_data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[deploy]
  release_command = 'fly machines destroy 871534f0540d78 -a roadcam --force'
  strategy = 'rolling'
